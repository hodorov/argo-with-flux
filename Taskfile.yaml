version: 3

env:
  REPOS: "argo-cd"
  # renovate: datasource=github-tags depName=argoproj/argo-cd
  ARGO_CD_VERSION: "v3.5.2"
  IMAGE_NAMESPACE: "ghcr.io/hodorov/argo-with-flux"
  ARGO_CD_LAST_PATH:
    sh: "cat patches/argo-cd/series | cut -d- -f1 | tail -1"
  BRANCH:
    sh: "[[ -n $GITHUB_REF_NAME ]] && (echo $GITHUB_REF_NAME | tr '/' '-') || (git rev-parse --abbrev-ref HEAD | tr '/' '-')"
  COMMIT:
    sh: "([[ -n $GITHUB_SHA ]] && echo $GITHUB_SHA || git rev-parse HEAD) | head -c8"
  VERSION: "{{.ARGO_CD_VERSION}}-awf.a{{.ARGO_CD_LAST_PATH}}-{{.BRANCH}}-{{.COMMIT}}"
tasks:
  cleanup:
    cmds:
      - cmd: rm -rf ./{{.ITEM}}
        for: { var: REPOS }

  # Since Argo CD v3 gitops-engine is vendored in the argo-cd repository
  # (module github.com/argoproj/argo-cd/gitops-engine), so only one repo is cloned
  clone:
    cmds:
      - git clone --single-branch -b {{.ARGO_CD_VERSION}} https://github.com/argoproj/argo-cd
      - cd argo-cd && git checkout -b patches
      - cd argo-cd && stg init

  prepare:
    cmds:
      - task: cleanup
      - task: clone

  patch:
    cmds:
      - cmd: cd {{.ITEM}} && stg import -t --series ../patches/{{.ITEM}}/series
        for: { var: REPOS }

  build:
    cmds:
      - echo '{{.VERSION}}' | cut -c 2- > argo-cd/VERSION
      - >
        cd argo-cd && BUILDKIT_PROGRESS=plain DOCKER_BUILDKIT=1 docker build
        -t {{.IMAGE_NAMESPACE}}/argocd:{{.VERSION}}
        --platform=linux/amd64
        --build-arg GIT_TAG={{.VERSION}}
        --build-arg GIT_COMMIT={{.COMMIT}}
        --build-arg GIT_TREE_STATE=clean
        .

  push:
    cmd: docker push {{.IMAGE_NAMESPACE}}/argocd:{{.VERSION}}

  _export-patch:
    internal: true
    label: "export-patch-{{.ITEM}}"
    dir: "{{.ITEM}}"
    cmds:
      - stg repair
      - stg export -n -p -d ../patches/{{.ITEM}}

  export-patch:
    deps:
      - task: _export-patch
        for: { var: REPOS }
        vars:
          ITEM: "{{.ITEM}}"